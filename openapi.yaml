          required: true
          schema:
            type: integer
          description: ID del trabajo recepcional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Fecha:
                  type: string
                  format: date
                  example: 2026-07-15
                Hora_inicio:
                  type: string
                  example: 10:00
                Hora_fin:
                  type: string
                  example: 12:00
                Fecha_defensa:
                  type: string
                  format: date-time
                  example: 2026-07-15T10:00:00.000Z
                Fecha_fin_defensa:
                  type: string
                  format: date-time
                  example: 2026-07-15T12:00:00.000Z
                Id_Lugar:
                  type: integer
                  example: 1
                  description: ID del salón o aula del catálogo Lugar
      responses:
        "200":
          description: Horario y lugar programados exitosamente
        "400":
          description: Conflicto de horario o espacio físico detectado
