openapi: 3.0.0
info:
  title: SGTR-FEI API - Sistema de Gestión de Trabajos Recepcionales
  version: 1.0.0
  description: Documentación interactiva de la API RESTful para el Sistema de
    Gestión de Información de Trabajos Recepcionales de la Facultad de
    Estadística e Informática (FEI) de la Universidad Veracruzana.
  contact:
    name: Facultad de Estadística e Informática - UV
    url: https://www.uv.mx/fei/
servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local
components:
  schemas:
    TrabajoRecepcional:
      type: object
      properties:
        Id_TrabajoR:
          type: integer
          example: 1
        Titulo:
          type: string
          example: Desarrollo de API para SGTR-FEI
        Folio:
          type: string
          example: Tomo 2 - Folio 98
        Tomo:
          type: integer
          example: 2
          description: Número de tomo/libro por carrera
        Numero_Folio:
          type: integer
          example: 98
          description: Número de folio del 1 al 100 dentro del tomo
        Modalidad:
          type: string
          example: Tesis
        Fecha_defensa:
          type: string
          format: date-time
          example: 2026-06-25T10:00:00.000Z
          description: Fecha y hora de inicio de la defensa
        Fecha_fin_defensa:
          type: string
          format: date-time
          example: 2026-06-25T12:00:00.000Z
          description: Fecha y hora de finalización de la defensa
        Resultado:
          type: string
          example: Aprobado por Unanimidad
        Id_Carrera:
          type: integer
          example: 1
        Id_Lugar:
          type: integer
          example: 1
        Id_Estado:
          type: integer
          example: 1
    CrearTrabajoDTO:
      type: object
      required:
        - Titulo
        - Modalidad
        - Id_Carrera
      properties:
        Titulo:
          type: string
          example: Sistema de Gestión de Información de Trabajos Recepcionales
        Modalidad:
          type: string
          example: Monografía
        Id_Carrera:
          type: integer
          example: 1
        Id_Lugar:
          type: integer
          example: 2
        Fecha_defensa:
          type: string
          format: date-time
          example: 2026-07-15T09:30:00.000Z
        Fecha_fin_defensa:
          type: string
          format: date-time
          example: 2026-07-15T11:30:00.000Z
    ActualizarTrabajoDTO:
      type: object
      properties:
        Titulo:
          type: string
          example: Título actualizado del trabajo
        Modalidad:
          type: string
          example: Tesina
        Fecha_defensa:
          type: string
          format: date-time
          example: 2026-08-10T11:00:00.000Z
        Fecha_fin_defensa:
          type: string
          format: date-time
          example: 2026-08-10T13:00:00.000Z
        Id_Lugar:
          type: integer
          example: 1
        Id_Carrera:
          type: integer
          example: 1
        Tomo:
          type: integer
          example: 2
          description: Solo editable si el trabajo está en estado Finalizado
        Numero_Folio:
          type: integer
          example: 98
          description: Del 1 al 100. Solo editable si el trabajo está en estado Finalizado
        Folio:
          type: string
          example: Tomo 2 - Folio 98
          description: Solo editable si el trabajo está en estado Finalizado
        Resultado:
          type: string
          example: Aprobado por Mayoría
          description: Solo editable si el trabajo está en estado Finalizado
    ProgramarDefensaDTO:
      type: object
      properties:
        Fecha:
          type: string
          format: date
          example: 2026-07-15
        Hora_inicio:
          type: string
          example: 10:00
        Hora_fin:
          type: string
          example: 12:00
        Fecha_defensa:
          type: string
          format: date-time
          example: 2026-07-15T10:00:00.000Z
        Fecha_fin_defensa:
          type: string
          format: date-time
          example: 2026-07-15T12:00:00.000Z
        Id_Lugar:
          type: integer
          example: 1
          description: ID del salón o espacio físico
    FinalizarTrabajoDTO:
      type: object
      required:
        - Tomo
        - Numero_Folio
        - Resultado
      properties:
        Tomo:
          type: integer
          example: 2
          description: Número de libro/tomo correspondiente a la carrera
        Numero_Folio:
          type: integer
          example: 98
          description: Número de folio del 1 al 100
        Folio:
          type: string
          example: Tomo 2 - Folio 98
          description: Opcional. Si no se envía se formatea automáticamente
        Resultado:
          type: string
          example: Aprobado por Unanimidad
    RechazarTrabajoDTO:
      type: object
      properties:
        motivo:
          type: string
          example: El título no coincide con el protocolo autorizado
    AsignarAcademicoDTO:
      type: object
      required:
        - Id_TrabajoR
        - Numero_Personal
        - Id_rol
      properties:
        Id_TrabajoR:
          type: integer
          example: 1
        Numero_Personal:
          type: integer
          example: 12345
        Id_rol:
          type: integer
          example: 1
          description: "1: Director, 2: Codirector, 3: Sinodal, etc."
    AsignarEstudianteDTO:
      type: object
      required:
        - Id_TrabajoR
        - Matricula
      properties:
        Id_TrabajoR:
          type: integer
          example: 1
        Matricula:
          type: string
          example: s20014589
    SecretariaGrupo:
      type: object
      properties:
        Numero_Personal:
          type: string
          example: S001
        Id_Secretaria:
          type: integer
          example: 1
        Nombre:
          type: string
          example: Carmen
        ApellidoP:
          type: string
          example: López
        ApellidoM:
          type: string
          example: Hernández
        CorreoInstitucional:
          type: string
          example: carlopez@uv.mx
        Rol:
          type: string
          example: Secretaria de Grupo
    CrearSecretariaDTO:
      type: object
      required:
        - Numero_Personal
        - Nombre
        - ApellidoP
        - ApellidoM
        - CorreoInstitucional
      properties:
        Numero_Personal:
          type: string
          example: S001
        Nombre:
          type: string
          example: Carmen
        ApellidoP:
          type: string
          example: López
        ApellidoM:
          type: string
          example: Hernández
        CorreoInstitucional:
          type: string
          example: carlopez@uv.mx
        Contrasenia:
          type: string
          example: secre2026
        Rol:
          type: string
          example: Secretaria de Grupo
    BitacoraAccion:
      type: object
      properties:
        IdAccion:
          type: integer
          example: 1
        Nombreaccion:
          type: string
          example: Aceptó el documento
        Fecha:
          type: string
          format: date-time
          example: 2026-09-21T10:00:00.000Z
        Numero_Personal:
          type: string
          example: S001
        Id_TrabajoR:
          type: integer
          example: 1
        Detalles:
          type: string
          example: Aceptó el documento Comprobante de no adeudo...
    RegistrarEntregaDTO:
      type: object
      required:
        - Id_TrabajoR
        - Matricula
        - Id_Documento
      properties:
        Id_TrabajoR:
          type: integer
          example: 1
        Matricula:
          type: string
          example: s20014589
        Id_Documento:
          type: integer
          example: 1
        Entregado:
          type: boolean
          example: true
        Numero_Personal:
          type: string
          example: S001
    ParticipanteExterno:
      type: object
      properties:
        Id_ParticipanteExt:
          type: integer
          example: 1
        Nombre:
          type: string
          example: Roberto
        ApellidoP:
          type: string
          example: Martínez
        ApellidoM:
          type: string
          example: Soto
        CorreoElectronico:
          type: string
          example: roberto.martinez@empresa.com
        Institucion:
          type: string
          example: Instituto Nacional de Investigaciones Eléctricas
    CrearParticipanteExternoDTO:
      type: object
      required:
        - Nombre
        - ApellidoP
      properties:
        Nombre:
          type: string
          example: Roberto
        ApellidoP:
          type: string
          example: Martínez
        ApellidoM:
          type: string
          example: Soto
        CorreoElectronico:
          type: string
          example: roberto.martinez@empresa.com
        Institucion:
          type: string
          example: Instituto Nacional de Investigaciones Eléctricas
    AsignarParticipanteExternoDTO:
      type: object
      required:
        - Id_TrabajoR
        - Id_ParticipanteExt
        - Id_rol
      properties:
        Id_TrabajoR:
          type: integer
          example: 1
        Id_ParticipanteExt:
          type: integer
          example: 1
        Id_rol:
          type: integer
          example: 2
          description: ID del rol institucional
    EstadoTrabajoRecepcional:
      type: object
      properties:
        Id_EstadoTrabajo:
          type: integer
          example: 1
        Fecha:
          type: string
          format: date-time
          example: 2026-06-25T10:00:00.000Z
        Id_Estado:
          type: integer
          example: 2
        Id_TrabajoR:
          type: integer
          example: 1
    ErrorRespuesta:
      type: object
      properties:
        error:
          type: string
          example: Mensaje descriptivo del error
        detalle:
          type: string
          example: Información adicional del error
paths:
  /api/trabajos:
    post:
      summary: Crear un nuevo trabajo recepcional en estado Borrador (CU-01)
      tags:
        - Trabajos Recepcionales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearTrabajoDTO"
      responses:
        "201":
          description: Trabajo recepcional creado exitosamente como borrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrabajoRecepcional"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
    get:
      summary: Listar trabajos recepcionales con filtros opcionales
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: query
          name: Id_Carrera
          schema:
            type: integer
          description: Filtrar por identificador de la carrera
        - in: query
          name: Id_Estado
          schema:
            type: integer
          description: Filtrar por identificador del estado (1:Borrador, 2:Registrado,
            3:Aprobado, 4:Generado, 5:Finalizado)
        - in: query
          name: Modalidad
          schema:
            type: string
          description: Filtrar por modalidad (Tesis, Tesina, Monografía, etc.)
      responses:
        "200":
          description: Lista de trabajos recepcionales obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrabajoRecepcional"
        "500":
          description: Error al consultar los registros
  /api/trabajos/siguiente-folio:
    get:
      summary: Sugerir el siguiente Tomo y Folio disponible para una carrera
      description: Calcula de forma automática el siguiente folio (1 al 100) en el
        tomo activo o sugiere el siguiente tomo si ya se completaron los 100
        folios.
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: query
          name: Id_Carrera
          required: true
          schema:
            type: integer
          description: Identificador de la carrera
        - in: query
          name: Tomo
          schema:
            type: integer
          description: Opcional. Tomo específico a consultar para buscar el primer folio
            libre.
      responses:
        "200":
          description: Sugerencia de tomo y folio disponible
        "400":
          description: Parámetros inválidos
  /api/trabajos/tomo-estado:
    get:
      summary: Consultar el estado y ocupación de folios de un tomo específico de una
        carrera
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: query
          name: Id_Carrera
          required: true
          schema:
            type: integer
        - in: query
          name: Tomo
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detalle de ocupación del tomo (folios ocupados, disponibles, total)
  /api/trabajos/tomos:
    get:
      summary: Listar todos los tomos registrados de una carrera con sus totales
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: query
          name: Id_Carrera
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lista de tomos de la carrera
  /api/trabajos/agenda/disponibilidad:
    get:
      summary: Consultar disponibilidad de lugares y si la carrera está libre para un
        horario
      description: Valida la Regla 1 (espacios no ocupados) y la Regla 2 (no más de
        una defensa simultánea de la misma carrera).
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: query
          name: Fecha
          required: false
          schema:
            type: string
            format: date
          example: 2026-07-15
        - in: query
          name: Hora_inicio
          required: false
          schema:
            type: string
          example: 10:00
        - in: query
          name: Hora_fin
          required: false
          schema:
            type: string
          example: 12:00
        - in: query
          name: Fecha_defensa
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: Fecha_fin_defensa
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: Id_Carrera
          required: false
          schema:
            type: integer
          description: Identificador de la carrera a consultar
        - in: query
          name: Id_TrabajoR
          required: false
          schema:
            type: integer
          description: ID del trabajo recepcional (para excluirlo al reprogramar)
      responses:
        "200":
          description: Diagnóstico de disponibilidad (carrera libre, lista de lugares
            disponibles y ocupados)
        "400":
          description: Horario o parámetros inválidos
  /api/trabajos/agenda/defensas:
    get:
      summary: Consultar la agenda o calendario de defensas programadas
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: query
          name: fecha
          schema:
            type: string
            format: date
          description: Consultar un día específico (YYYY-MM-DD)
        - in: query
          name: fechaInicio
          schema:
            type: string
            format: date
        - in: query
          name: fechaFin
          schema:
            type: string
            format: date
        - in: query
          name: Id_Carrera
          schema:
            type: integer
        - in: query
          name: Id_Lugar
          schema:
            type: integer
      responses:
        "200":
          description: Lista de defensas programadas ordenadas cronológicamente
  "/api/trabajos/{id}":
    get:
      summary: Obtener el detalle completo de un trabajo recepcional por su ID
      description: Incluye carrera, lugar, estado, estudiantes vinculados y académicos
        con sus roles de participación.
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del trabajo recepcional
      responses:
        "200":
          description: Registro encontrado con detalle completo
        "404":
          description: Trabajo recepcional no encontrado
    put:
      summary: Editar información de un trabajo recepcional (CU-05)
      description: En estados Aprobado o Generado los campos Folio y Resultado están
        bloqueados. En estado Finalizado todos los campos son editables.
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del trabajo recepcional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarTrabajoDTO"
      responses:
        "200":
          description: Trabajo recepcional actualizado con éxito
        "400":
          description: Error de validación o campo bloqueado según el estado
    delete:
      summary: Eliminar registro de trabajo recepcional
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del trabajo recepcional
      responses:
        "200":
          description: Registro eliminado correctamente
        "400":
          description: Error al eliminar el registro
  "/api/trabajos/{id}/enviar":
    post:
      summary: Enviar trabajo recepcional a validación de Secretaría (CU-02)
      description: Cambia el estado del trabajo de Borrador a Registrado.
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del trabajo recepcional
      responses:
        "200":
          description: Trabajo recepcional enviado a validación con éxito
        "400":
          description: El trabajo no se encuentra en estado Borrador
  "/api/trabajos/{id}/validar":
    post:
      summary: Aprobar trabajo recepcional (CU-03)
      description: Cambia el estado del trabajo de Registrado a Aprobado por la
        Secretaría de Facultad.
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del trabajo recepcional
      responses:
        "200":
          description: Trabajo recepcional aprobado con éxito
        "400":
          description: El trabajo no se encuentra en estado Registrado
  "/api/trabajos/{id}/rechazar":
    post:
      summary: Rechazar trabajo recepcional y devolver a borrador (CU-04)
      description: Regresa el estado del trabajo a Borrador para correcciones del
        profesor responsable.
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del trabajo recepcional
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RechazarTrabajoDTO"
      responses:
        "200":
          description: Trabajo recepcional devuelto a borrador
        "400":
          description: El trabajo no se encuentra en estado Registrado
  "/api/trabajos/{id}/finalizar":
    post:
      summary: Finalizar trabajo recepcional con asignación de Folio y Resultado formal
      description: Registra el Folio oficial y el Resultado de la defensa, cambiando
        el estado a Finalizado.
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del trabajo recepcional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizarTrabajoDTO"
      responses:
        "200":
          description: Trabajo recepcional finalizado con éxito
        "400":
          description: Folio o Resultado inválidos
  "/api/trabajos/{id}/estado":
    patch:
      summary: Cambio manual de estado (mantenimiento administrativo)
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del trabajo recepcional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nuevoEstado
              properties:
                nuevoEstado:
                  type: string
                  example: Aprobado
      responses:
        "200":
          description: Estado actualizado con éxito
        "400":
          description: Estado no válido
  "/api/trabajos/{id}/generar-acta":
    post:
      summary: Generar acta de trabajo recepcional tras verificar el checklist
        completo (CU-06)
      description: Cambia el estado del trabajo de Aprobado a Generado, habilitando la
        posterior finalización del trámite.
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del trabajo recepcional
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Numero_Personal:
                  type: string
                  example: S001
      responses:
        "200":
          description: Acta generada exitosamente, estado cambiado a Generado
        "400":
          description: El trabajo no está en estado Aprobado o faltan documentos en el
            checklist
  "/api/trabajos/{id}/documentos":
    get:
      summary: Obtener el checklist de documentos requeridos y entregados para este
        trabajo
      tags:
        - Documentos
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del trabajo recepcional
      responses:
        "200":
          description: Checklist de documentos por estudiante
    post:
      summary: Registrar entrega de un documento para este trabajo recepcional
      tags:
        - Documentos
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - Matricula
                - Id_Documento
              properties:
                Matricula:
                  type: string
                Id_Documento:
                  type: integer
                Entregado:
                  type: boolean
                Numero_Personal:
                  type: string
      responses:
        "200":
          description: Entrega registrada exitosamente
    delete:
      summary: Revocar la entrega de un documento para este trabajo recepcional
      tags:
        - Documentos
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - Matricula
                - Id_Documento
              properties:
                Matricula:
                  type: string
                Id_Documento:
                  type: integer
                Numero_Personal:
                  type: string
      responses:
        "200":
          description: Entrega revocada exitosamente
  "/api/trabajos/{id}/documentos/lote":
    post:
      summary: Registrar entregas de documentos en lote para este trabajo recepcional
      tags:
        - Documentos
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entregas
              properties:
                Numero_Personal:
                  type: string
                entregas:
                  type: array
                  items:
                    type: object
                    required:
                      - Matricula
                      - Id_Documento
                    properties:
                      Matricula:
                        type: string
                      Id_Documento:
                        type: integer
                      Entregado:
                        type: boolean
      responses:
        "200":
          description: Entregas procesadas exitosamente
  "/api/trabajos/{id}/historial-estados":
    get:
      summary: Obtener el historial cronológico de cambios de estado del trabajo
        recepcional
      tags:
        - Trabajos Recepcionales
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del trabajo recepcional
      responses:
        "200":
          description: Historial de transiciones de estado con fechas
        "404":
          description: Trabajo no encontrado
  "/api/trabajos/{id}/programar-defensa":
    post:
      summary: Programar o reprogramar el horario y lugar de la defensa recepcional
      description: "Aplica las reglas institucionales de validación de conflictos
        (Regla 1: espacio físico ocupado, Regla 2: no defensas simultáneas de la
        misma carrera)."
